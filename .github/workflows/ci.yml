name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: typecheck, lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  journey:
    name: end-to-end journey on postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bothsides
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Start the app against real postgres
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bothsides
          NEXT_PUBLIC_SANITY_PROJECT_ID: '4npxmu4m'
          NEXT_PUBLIC_SANITY_DATASET: production
        run: |
          npm run build
          (npm run start &) 
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then break; fi
            sleep 2
          done

      - name: Run the end-to-end journey
        env:
          BASE_URL: http://127.0.0.1:3000
        run: npm run verify:live